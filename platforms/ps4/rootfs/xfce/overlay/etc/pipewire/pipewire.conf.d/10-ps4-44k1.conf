# PS4 HDMI audio: run the graph at 44.1 kHz.
#
# Native 48 kHz on the MN864729 HDMI bridge is corrupted (robotic) regardless of
# the codec converter sequence or the BDL geometry. 44.1 kHz is the verified
# clean hardware path, and 48 kHz content is resampled onto it.
#
# Evidence: platforms/ps4/experiments/SESSIONS.md EXP-20261022-055 through
# EXP-20261022-067. Remove this file once native 48 kHz is qualified against an
# Orbis reference capture.
context.properties = {
    default.clock.rate = 44100
    default.clock.allowed-rates = [ 44100 ]
}
